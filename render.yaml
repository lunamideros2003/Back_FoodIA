# FoodMood IA · backend en Render
#
# Este archivo es un "Blueprint": Render lo lee y arma el servicio con esta
# configuración. Los secretos (contraseña de Supabase, clave de IA) NO van
# aquí: se pegan en el panel web, en Environment. Las variables con
# `sync: false` son justamente las que Render te pide al crear el servicio.
#
# Los datos viven en Supabase (Postgres), no en el disco de Render. Por eso el
# plan free alcanza: aunque Render recicle el contenedor, la base sigue ahí.

services:
  - type: web
    name: foodmood-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Cadena "Session Pooler" de Supabase. Es un secreto: se pega en el panel.
      # postgresql://postgres.PROYECTO:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true

      # El proxy HTTP de Render no enruta HTTP/2, así que el gRPC nativo se
      # apaga. El gRPC-Web sigue funcionando por /api/grpc.
      - key: GRPC_PORT
        value: 0

      # Dominio real del frontend en Vercel. Si cambia, actualízalo.
      - key: CORS_ORIGIN
        value: https://fron-food-ia.vercel.app

      # IA: local funciona sin internet. Para usar Groq u OpenAI cambia
      # AI_PROVIDER y pega la clave en el panel (AI_API_KEY).
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        sync: false
